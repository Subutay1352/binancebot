# Tek servis = bot (go run ./cmd/bot ile aynı). Dashboard aynı process'te PORT'ta açılır.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    runtime: docker
    name: binancebot
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET_KEY
        sync: false
      - key: BINANCE_FUTURES_TESTNET
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TRADE_SYMBOLS
        sync: false
      - key: STOP_LOSS_PERCENT
        sync: false
      - key: TAKE_PROFIT_PERCENT
        sync: false
      - key: POSITION_SIZE_USD
        sync: false
      - key: LEVERAGE
        sync: false
      - key: MAX_OPEN_TRADES
        sync: false
      - key: EXECUTOR_POLL_INTERVAL_SEC
        sync: false
      - key: STRATEGY_INTERVAL
        sync: false
      - key: STRATEGY_RSI_PERIOD
        sync: false
      - key: STRATEGY_RSI_LOW
        sync: false
      - key: STRATEGY_RSI_HIGH
        sync: false
      - key: STRATEGY_MIN_VOLUME_USD
        sync: false
      - key: STRATEGY_VOLUME_RATIO
        sync: false
